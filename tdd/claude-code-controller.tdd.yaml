    when: the per-session settings file is generated
    then: it registers Notification and Stop hooks that call ccctl hook for slot 2
    oracle: JSON hooks.Notification[0].hooks[0].command == 'C hook --slot 2' AND the same for hooks.Stop
    doubles: none; pure function
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-008-a
    status: green
  - id: SC-008-b
