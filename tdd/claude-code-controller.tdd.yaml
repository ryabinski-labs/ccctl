    when: the fake session invokes its Stop hook
    then: pane 1's header shows the badge
    oracle: pane 1 header shows text 'Needs input' within 2000 ms
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - playwright
    test_ref: web/e2e/claude_code_controller.tdd.spec.ts::SC-008-e
    status: green
  - id: SC-008-f
    level: integration
    title: Automatic terminal replies do not clear needs-input
    given: slot 2 in needs-input
    when: the browser terminal sends focus-in (ESC [ I) and a cursor position report (ESC [ 12;40 R), then the owner types y
    then: the replies leave needs-input set and only the keystroke clears it
    oracle: slot 2 state == needs-input after the replies AND == running after 'y'
