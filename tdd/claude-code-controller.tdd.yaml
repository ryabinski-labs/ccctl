    test_ref: internal/tdd/lifecycle_test.go::SC-008-b
    status: green
  - id: SC-008-c
    level: integration
    title: Keystroke clears needs-input
    given: slot 2 in needs-input
    when: an input frame for slot 2 arrives
    then: slot 2 returns to running
    oracle: slot 2 state == running after the frame
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/lifecycle_test.go::SC-008-c
    status: green
  - id: SC-008-d
    level: unit
    title: Title count and chime
    given: the page with the chime unmuted
    when: slots 1 and 3 enter needs-input, slot 1 re-reports needs-input, then the owner mutes and slot 2 enters needs-input
    then: the title counts panes and the chime plays once per transition only while unmuted
    oracle: document.title starts with '(2) ' then '(3) ' AND chime play count == 2 AND with zero needs-input panes the title
      has no prefix
    doubles: mock Audio; mocked session store
    tags:
    - vitest
    test_ref: web/src/tdd/claude_code_controller.tdd.spec.ts::SC-008-d
    status: green
  - id: SC-008-e
