- id: REQ-009
  text: On startup the controller relaunches every session that was starting, running, or needs-input with claude --resume
    in its original slot and folder before accepting connections; a resume that exits non-zero within 5 seconds shows resume-failed
    with Start fresh and Close.
  priority: P1
  type: functional
  prd_ref: §5 story 7; DL-013; DL-017; A-009; A-010
  scenarios:
  - id: SC-009-a
    level: integration
    title: Live sessions resume in place, others do not
    given: state.json with slots 1-3 running (UUIDs U1-U3) and slot 4 exited
    when: the controller starts
    then: 3 processes are started with --resume in their original folders and slots, before the listener binds; slot 4 is
      not relaunched
    oracle: fake claude invocations == 3 with argv [claude_path, '--resume', Ui, '--dangerously-skip-permissions', '--settings',
      Fi] and cwd == recorded cwd for slot i AND every spawn timestamp < listener bind timestamp AND no invocation for slot
      4
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/lifecycle_test.go::SC-009-a
    status: green
  - id: SC-009-b
    level: integration
    title: Failed resume is reported
    given: state.json with slot 1 running and a fake claude that exits with code 1 on --resume
    when: the controller starts
    then: slot 1 becomes resume-failed with the message and a log line
    oracle: slot 1 state == resume-failed AND pane message == 'Could not resume TASK (exit code 1).' AND a log line has event
      == resume_failed, exit_code == 1
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    negative: true
    tags:
    - go
    test_ref: internal/tdd/lifecycle_test.go::SC-009-b
    status: green
  - id: SC-009-c
    level: integration
    title: Start fresh after a failed resume
    given: slot 1 in resume-failed for task T in worktree W with UUID U
    when: the owner triggers Start fresh
    then: a new session starts in the same slot and folder with a new UUID and no --resume
    oracle: new argv contains '--session-id' V with V != U AND argv lacks '--resume' AND cwd == W AND slot == 1 AND state.json
      slot 1 session_id == V
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/lifecycle_test.go::SC-009-c
    status: green
  - id: SC-009-d
    level: unit
    title: State file durability and version guard
    given: a state directory in a temp HOME
    when: state is saved, and a file with version 2 is loaded
    then: saves are atomic with mode 0600 and a newer version is refused
    oracle: saved file mode == 0600 AND version == 1 AND a save interrupted before rename leaves the old file intact AND load(version
      2) errors with 'State file version 2 is newer than this ccctl supports.'
    doubles: real filesystem temp dir
    negative: true
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-009-d
    status: green
