schema: tdd-artifact/v1
feature: claude-code-controller
title: Claude Code controller
source:
  prd: docs/prd/claude-code-controller.md
  prd_sha256: c70f7611af3a235bbd991fb5dad9967234f6ffbed1c5987e0ffc866ac409c61c
defaults:
  priority: P2
non_goals:
- Mobile phone layout and on-screen key bar (DL-005)
- Structured chat or diff view, Agent SDK, or stream-json rendering (DL-001)
- Controlling more than one host from one page (DL-001)
- tmux integration or attaching to sessions over SSH (DL-001)
- Read-only viewers or multi-user roles (DL-006)
- More than 4 concurrent sessions (DL-010)
- HTTPS, TLS certificates, and OS-level browser notifications (DL-009)
- Permission modes other than bypass (DL-008)
- Automatic worktree removal (DL-012)
- Managing Claude credentials, API keys, or billing (A-007)
open_questions:
- id: OQ-1
  text: With 3 sessions running and an exited pane not yet closed, can New session launch, and where?
  blocks:
  - REQ-007
  resolved: true
  resolution: 'DL-016: exited and resume-failed panes count as free; the lowest free slot is replaced.'
- id: OQ-2
  text: What does Start fresh launch after a failed resume?
  blocks:
  - REQ-009
  resolved: true
  resolution: 'DL-017: a new session with a new UUID in the same slot, worktree, and branch.'
requirements:
- id: REQ-001
  text: The owner can launch a Claude Code session into a free slot for a named task; it starts within 5 seconds in a new
    git worktree on branch ctl/TASK with --dangerously-skip-permissions and a recorded --session-id.
  priority: P0
  type: functional
  prd_ref: §5 story 1 criteria 1-2; DL-008; DL-012 worktree naming
  scenarios:
  - id: SC-001-a
    level: acceptance
    title: Launch form starts a live session in a new worktree
    given: the controller runs with the fake claude, the owner's Tailscale login, a git repo folio under a scanned root, and
      4 free slots
    when: the owner submits the launch form with task fix-login, repo folio, worktree on, first prompt hello world
    then: slot 1 shows the fake claude banner reporting the worktree cwd, the bypass flag, the session UUID, and the prompt
    oracle: within 5000 ms pane 1 text contains 'FAKE_CLAUDE cwd=ROOT/folio-wt-fix-login', '--dangerously-skip-permissions',
      '--session-id UUID' and 'prompt=hello world'; state.json slots[0].session_id == UUID
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    data:
      task: fix-login
      repo: folio
      prompt: hello world
    tags:
    - playwright
    test_ref: web/e2e/claude_code_controller.tdd.spec.ts::SC-001-a
    status: green
  - id: SC-001-b
    level: integration
    title: Worktree is a sibling folder on ctl/TASK from HEAD
    given: a temporary git repo folio with HEAD at commit C
    when: the session manager prepares a worktree for task fix-login
    then: folder folio-wt-fix-login exists next to folio on new branch ctl/fix-login at commit C
    oracle: git -C ../folio-wt-fix-login rev-parse --abbrev-ref HEAD == 'ctl/fix-login' AND rev-parse HEAD == C
    doubles: real git in a temp directory
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-001-b
    status: green
  - id: SC-001-c
    level: unit
    title: Fresh-launch argv
    given: claude_path /h/.local/bin/claude, session UUID U, settings file F
    when: the launch argv is built with and without a first prompt
    then: the argv carries the bypass flag, the session id and the settings file, and the prompt only when given
    oracle: argv == [claude_path, '--dangerously-skip-permissions', '--session-id', U, '--settings', F, 'hello'] with prompt;
      identical minus the last element without prompt
    doubles: none; pure function
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-001-c
    status: green
- id: REQ-002
  text: Invalid launch input is refused with the spec's message and no session, folder, or branch is created.
  priority: P0
  type: functional
  prd_ref: §5 story 1 criteria 3-7; A-008
  scenarios:
  - id: SC-002-a
    level: unit
    title: Task name rules and boundaries
    given: open sessions named fix-login
    when: each candidate task name is validated
    then: valid names are normalized to lowercase and invalid ones are refused with the rule message
    oracle: 'accepted: ''a'', 40x''a'', ''Fix-Api'' -> ''fix-api''; refused with exact text ''Task name must be 1 to 40 characters
      of a-z, 0-9 or -, and unique among open sessions.'': '''', 41x''a'', ''fix_login'', ''fix login'', ''café'', ''fix-login'''
    doubles: none; pure function
    negative: true
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-002-a
    status: green
  - id: SC-002-b
    level: unit
    title: Custom path rules
    given: a temp dir D containing file f.txt
    when: custom paths '/opt/x' (missing), 'D/f.txt' (file), 'rel/path' (relative), and D are validated
    then: only D is accepted; the others are refused
    oracle: '''/opt/x'' refused with exact text ''Path /opt/x does not exist or is not a folder.''; ''D/f.txt'' refused with
      the same pattern; ''rel/path'' refused; D accepted'
    doubles: real filesystem temp dir
    negative: true
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-002-b
    status: green
  - id: SC-002-c
    level: integration
    title: Existing worktree folder or branch blocks launch
    given: repo folio where folder folio-wt-fix-login already exists, and separately where branch ctl/fix-login already exists
    when: a launch for task fix-login is requested
    then: the launch is refused and nothing is created or spawned
    oracle: response error == 'Worktree folder or branch for fix-login already exists. Choose another task name.' AND fake
      claude invocation count == 0 AND git branch list and folder list unchanged
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs; real git
    negative: true
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-002-c
    status: green
  - id: SC-002-d
    level: integration
    title: Non-git folder runs without a worktree
    given: a plain folder notes with no .git
    when: the folder is inspected and then launched with worktree off
    then: inspection reports worktree unavailable with the note and the session runs in the folder itself
    oracle: 'inspect response worktree_allowed == false AND note == ''Not a git repository: session runs in the folder itself.''
      AND fake claude reports cwd == notes AND no folder notes-wt-* exists'
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-002-d
    status: green
  - id: SC-002-e
    level: integration
    title: Missing claude binary is reported
    given: claude_path points to a path with no executable file
    when: a launch is requested
    then: the launch is refused with the configuration message
    oracle: response error == 'Claude Code was not found at CLAUDE_PATH. Set claude_path in ~/.ccctl/config.toml.' with CLAUDE_PATH
      replaced AND no process started
    negative: true
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-002-e
    status: green
  - id: SC-002-f
    level: unit
    title: First prompt length boundary
    given: first prompts of 10,000 and 10,001 characters
    when: each launch request is validated
    then: 10,000 characters is accepted and 10,001 is refused with no session
    oracle: validate(len 10000) == ok AND validate(len 10001) returns an error
    doubles: none; pure function
    negative: true
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-002-f
    status: green
  - id: SC-002-g
    level: unit
    title: Launch form disables worktree for non-git folders
    given: 'the repo inspection result {worktree_allowed: false}'
    when: the launch form renders for that folder
    then: the worktree toggle is off and disabled and the note is shown
    oracle: 'toggle.checked == false AND toggle.disabled == true AND text ''Not a git repository: session runs in the folder
      itself.'' is visible'
    doubles: mocked inspection API response
    tags:
    - vitest
    test_ref: web/src/tdd/claude_code_controller.tdd.spec.ts::SC-002-g
    status: green
- id: REQ-003
  text: The launch form lists git repos found up to 3 folder levels under each existing root (default ~/projects and ~/Documents)
    plus direct children of home, and also accepts a custom path.
  priority: P0
  type: functional
  prd_ref: §6 launch form; DL-011; A-020
  scenarios:
  - id: SC-003-a
    level: integration
    title: Repo scan depth and missing roots
    given: a temp HOME with no projects folder, Documents/a (depth 1), Documents/x/y/b (depth 3), Documents/x/y/z/c (depth
      4), and HOME/d, each with .git
    when: the repo scanner runs with default roots
    then: repos at depth 3 or less and home children are listed, depth 4 is not, and the missing root is skipped
    oracle: result set == {Documents/a, Documents/x/y/b, HOME/d} AND scanner returned no error
    doubles: real filesystem temp HOME
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-003-a
    status: green
- id: REQ-004
  text: The owner sees every session's live output in its own pane and keystrokes typed in a pane reach only that session's
    PTY; a maximized pane resizes its PTY.
  priority: P0
  type: functional
  prd_ref: §5 story 2
  scenarios:
  - id: SC-004-a
    level: acceptance
    title: Typing in pane 2 reaches only session 2
    given: 4 running fake claude sessions that echo every received byte
    when: the owner focuses pane 2 and types hello and Enter
    then: pane 2 shows the echo and no other session received input
    oracle: pane 2 text contains 'ECHO hello' within 2000 ms AND fake claude input logs for slots 1, 3, 4 are empty
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - playwright
    test_ref: web/e2e/claude_code_controller.tdd.spec.ts::SC-004-a
    status: green
  - id: SC-004-b
    level: integration
    title: Input bytes route exactly to one PTY
    given: 4 sessions connected to one WebSocket client
    when: the client sends input frames for slot 2 carrying 'hello\r', ESC, Ctrl-C, and ESC [A
    then: session 2's PTY receives exactly those bytes and the others receive none
    oracle: bytes read by fake 2 == 68656c6c6f0d 1b 03 1b5b41 (hex, concatenated) AND fakes 1, 3, 4 read 0 bytes within 500
      ms
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/io_test.go::SC-004-b
    status: green
  - id: SC-004-c
    level: integration
    title: Output fan-out keeps per-slot order
    given: 4 fake sessions that each print lines 1..1000 tagged with their slot
    when: a WebSocket client collects output frames
    then: every slot's lines arrive complete and in order and tagged with the right slot
    oracle: for each slot s, parsed line numbers from frames tagged s == [1..1000] in order AND no line tagged s contains
      another slot's marker
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/io_test.go::SC-004-c
    status: green
  - id: SC-004-d
    level: integration
    title: Resize frame sets PTY window size
    given: a running session in slot 3
    when: the client sends a resize frame of 50 rows by 200 columns for slot 3
    then: the PTY window size matches
    oracle: TIOCGWINSZ on slot 3's PTY returns rows == 50 AND cols == 200
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    tags:
    - go
    test_ref: internal/tdd/io_test.go::SC-004-d
    status: green
  - id: SC-004-e
    level: unit
    title: Maximize and restore
    given: the grid with 4 panes
    when: the owner clicks maximize on pane 3 and then restore
    then: pane 3 alone fills the grid, then the 2x2 layout returns
    oracle: after maximize exactly 1 pane is visible (slot 3); after restore 4 panes are visible in a 2-column grid
    doubles: mocked session store
    tags:
    - vitest
    test_ref: web/src/tdd/claude_code_controller.tdd.spec.ts::SC-004-e
    status: green
  - id: SC-004-f
    level: acceptance
    title: End-to-end output latency over the tailnet
    given: the controller on mac-mini with 4 busy sessions and the page open on yonis-macbook-pro
    when: 200 timestamped echo samples are sent through pane 1
    then: the p95 output-to-render latency is within budget
    oracle: p95(render_time - send_time) over 200 samples <= 250 ms
    tags:
    - nfr
    - manual
    status: red
- id: REQ-005
  text: 'Only Tailscale logins in allowed_logins (default: the host node''s own login) can load the page or open the WebSocket;
    every other caller gets HTTP 403, and the listener binds only to the host''s Tailscale IPv4.'
  priority: P0
  type: functional
  prd_ref: §5 story 3; DL-006; A-006; §13 security
  scenarios:
  - id: SC-005-a
    level: unit
    title: Authorization decision table
    given: allowlist [owner@example]
    when: authorize is called for owner@example, other@example, and a WhoIs failure with empty login
    then: only the listed login is allowed
    oracle: 'results == {owner@example: allow, other@example: deny, '''' (WhoIs error): deny}'
    doubles: none; pure function
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-005-a
    status: green
  - id: SC-005-b
    level: integration
    title: Unlisted login gets the 403 page and an audit line
    given: the fake WhoIs maps the caller to other@example
    when: the caller requests GET /
    then: the controller refuses with the named page and logs auth_denied
    oracle: 'status == 403 AND body contains ''Not authorized: other@example is not on this controller\''s allowlist.'' AND
      a JSON log line has event == auth_denied, login == other@example, path == /'
    doubles: fake WhoIs; real HTTP server on 127.0.0.1
    negative: true
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-005-b
    status: green
  - id: SC-005-c
    level: integration
    title: Unlisted login cannot open the WebSocket
    given: the fake WhoIs maps the caller to other@example and one session is running
    when: the caller attempts the WebSocket upgrade and sends an input frame
    then: the upgrade is refused and the session receives nothing
    oracle: upgrade status == 403 AND fake claude read 0 bytes
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    negative: true
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-005-c
    status: green
  - id: SC-005-d
    level: integration
    title: Foreign or missing Origin is refused
    given: the fake WhoIs maps the caller to the owner
    when: WebSocket upgrades arrive with Origin https://evil.example and with no Origin
    then: both are refused
    oracle: both upgrade statuses == 403
    doubles: fake WhoIs
    negative: true
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-005-d
    status: green
  - id: SC-005-e
    level: integration
    title: Listener binds only to the Tailscale IPv4
    given: the fake Tailscale status reports IPv4 T and the host has another non-loopback address L
    when: the controller starts serving on port P
    then: only T:P accepts connections
    oracle: listener.Addr() == T:P AND dialing L:P fails with connection refused
    doubles: fake Tailscale status
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-005-e
    status: green
  - id: SC-005-f
    level: unit
    title: Default allowlist is the host node's login
    given: tailscale status JSON whose Self.UserID maps to login owner@example and a config without allowed_logins
    when: the config is loaded
    then: the effective allowlist is the host node's login
    oracle: effective allowed_logins == ['owner@example']
    doubles: status JSON fixture
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-005-f
    status: green
  - id: SC-005-g
    level: unit
    title: WhoIs results cached 60 seconds per address
    given: a fake clock and a counting fake WhoIs
    when: the same remote address is looked up at t=0, t=59s and t=61s
    then: WhoIs is called at t=0 and t=61s only
    oracle: whois call count == 1 after t=59s AND == 2 after t=61s
    doubles: fake clock; counting fake WhoIs
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-005-g
    status: green
  - id: SC-005-h
    level: integration
    title: Every route enforces the allowlist
    given: the full registered route table and a caller mapped to other@example
    when: each route is requested
    then: every route answers 403
    oracle: 'for all routes r in the router: status(r) == 403'
    doubles: fake WhoIs
    negative: true
    tags:
    - security
    - go
    test_ref: internal/tdd/auth_test.go::SC-005-h
    status: green
- id: REQ-006
  text: 'The controller checks Tailscale every 10 seconds: when Tailscale is not Running it serves nothing and reports the
    spec message, keeps sessions alive, and binds again when Tailscale returns; the page shows a reconnect banner with 1,
    2, 4, 8, 16, then 30 second retries.'
  priority: P0
  type: functional
  prd_ref: §5 story 4; DL-007; A-005; A-021
  scenarios:
  - id: SC-006-a
    level: unit
    title: Tailscale CLI discovery order
    given: combinations of tailscale_path in config, tailscale on PATH, and the app-bundle binary
    when: the CLI path is resolved
    then: config wins over PATH, PATH wins over the app bundle, and none gives the named message
    oracle: resolve() returns config path, else PATH hit, else '/Applications/Tailscale.app/Contents/MacOS/Tailscale'; with
      none it returns error 'Tailscale CLI not found. Install Tailscale or set tailscale_path in ~/.ccctl/config.toml.'
    doubles: fake filesystem lookups
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-006-a
    status: green
  - id: SC-006-b
    level: unit
    title: Monitor interval and transitions
    given: a monitor with default settings
    when: backend states Running, Stopped, NeedsLogin, Running are observed
    then: it binds on Running, unbinds on anything else, and uses a 10 second interval
    oracle: default interval == 10s AND actions == [bind, unbind, (no-op), bind]
    doubles: none; state machine
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-006-b
    status: green
  - id: SC-006-c
    level: integration
    title: Startup with Tailscale stopped
    given: the fake Tailscale reports BackendState Stopped and the check interval is 100 ms
    when: the controller starts, then the fake switches to Running
    then: nothing listens and the message is logged and shown by ccctl status until Tailscale runs, then it binds
    oracle: 'log and ''ccctl status'' output contain ''Tailscale is not running on this host. Start the Tailscale app or run:
      sudo tailscale up. Retrying every 10 seconds.'' AND ccctl status exit code == 3 AND no listener before the switch AND
      listener bound within 200 ms after it'
    doubles: fake Tailscale status; injected interval
    negative: true
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-006-c
    status: green
  - id: SC-006-d
    level: integration
    title: Tailscale drop keeps sessions alive
    given: a serving controller with 2 running sessions
    when: the fake Tailscale switches to Stopped and then back to Running
    then: the listener closes, tailscale_down is logged, sessions survive, and the listener returns
    oracle: after the drop dialing the address fails AND a log line has event == tailscale_down AND both session PIDs are
      alive AND after recovery dialing succeeds
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs; injected
      interval
    tags:
    - go
    test_ref: internal/tdd/auth_test.go::SC-006-d
    status: green
  - id: SC-006-e
    level: unit
    title: Reconnect backoff and banner text
    given: a page whose WebSocket closes repeatedly for host mac-mini
    when: 7 consecutive reconnect attempts fail
    then: retry delays follow the schedule and the banner shows the host and the countdown
    oracle: delays == [1,2,4,8,16,30,30] seconds AND banner text == 'Lost connection to mac-mini. Check that Tailscale is
      on for this device and for mac-mini. Retrying in 1 s.' on the first attempt
    doubles: fake timers; mock WebSocket
    tags:
    - vitest
    test_ref: web/src/tdd/claude_code_controller.tdd.spec.ts::SC-006-e
    status: green
  - id: SC-006-f
    level: acceptance
    title: Banner appears when the controller goes away
    given: the page is connected to a running controller
    when: the controller process is stopped
    then: the page shows the reconnect banner
    oracle: text starting 'Lost connection to' and containing 'Check that Tailscale is on for this device' is visible within
      3000 ms
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    negative: true
    tags:
    - playwright
    test_ref: web/e2e/claude_code_controller.tdd.spec.ts::SC-006-f
    status: green
  - id: SC-006-g
    level: integration
    title: A second controller refuses to start
    given: a controller running for this user
    when: a second ccctl serve starts with the same home
    then: it refuses with the named message and leaves the first controller's hook socket in place
    oracle: second Run returns 'ccctl is already running for this user. Stop it first (ccctl uninstall, or stop the other ccctl serve).' AND the first socket file still exists
    doubles: fake Tailscale status and WhoIs
    tags:
    - go
    - found-in-smoke-test
    test_ref: internal/tdd/auth_test.go::SC-006-g
    status: green
  - id: SC-006-h
    level: unit
    title: Tailscale CLI runs in CLI mode under a service manager
    given: launchd's minimal environment (HOME and PATH only), where the macOS app-bundle binary starts its GUI instead of the CLI
    when: the controller builds the environment for a Tailscale CLI call
    then: the environment forces CLI mode and keeps the inherited variables
    oracle: env contains 'TAILSCALE_BE_CLI=1' AND the inherited HOME
    doubles: none; pure function
    tags:
    - go
    - found-on-mac-mini
    test_ref: internal/tdd/unit_test.go::SC-006-h
    status: green
- id: REQ-007
  text: At most 4 sessions are active (starting, running, needs-input); a launch takes the lowest free slot, where exited
    and resume-failed panes count as free and are replaced without touching their worktrees.
  priority: P0
  type: functional
  prd_ref: §5 story 5; DL-010; DL-016
  scenarios:
  - id: SC-007-a
    level: unit
    title: Slot allocation table
    given: slot states combinations
    when: the next slot is chosen
    then: the lowest slot that is empty, exited or resume-failed is chosen; none when 4 are active
    oracle: '[empty,run,run,run]->1; [run,run,run,exited]->4; [run,resume-failed,exited,run]->2; [run,starting,needs-input,run]->none'
    doubles: none; pure function
    tags:
    - go
    test_ref: internal/tdd/unit_test.go::SC-007-a
    status: green
  - id: SC-007-b
    level: integration
    title: Fifth active launch is refused
    given: 4 active sessions
    when: a launch request arrives through the API
    then: it is refused with 409 and nothing starts
    oracle: status == 409 AND body contains 'All 4 slots are in use. Stop or close a session first.' AND fake claude invocation
      count stays 4
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
    negative: true
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-007-b
    status: green
  - id: SC-007-c
    level: integration
    title: Exited pane is replaced and its worktree kept
    given: 3 running sessions and slot 4 exited for task old-task with worktree W
    when: a launch for task new-task is requested
    then: the new session occupies slot 4 and W with branch ctl/old-task still exists
    oracle: slot 4 task == new-task AND folder W exists AND git branch list contains ctl/old-task
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs; real git
    tags:
    - go
    test_ref: internal/tdd/launch_test.go::SC-007-c
    status: green
  - id: SC-007-d
    level: unit
    title: New session control state
    given: a session store with 4 active slots, and then 3 active plus 1 exited
    when: the header renders
    then: the control is disabled with the tooltip in the first case and enabled in the second
    oracle: 'case 1: button.disabled == true AND title == ''All 4 slots are in use. Stop or close a session first.''; case
      2: button.disabled == false'
    doubles: mocked session store
    tags:
    - vitest
    test_ref: web/src/tdd/claude_code_controller.tdd.spec.ts::SC-007-d
    status: green
- id: REQ-008
  text: A pane shows Needs input within 2 seconds of Claude Code's Notification or Stop hook, the tab title counts such panes,
    a single chime plays per transition unless muted, and any keystroke clears it.
