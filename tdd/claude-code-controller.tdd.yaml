    then: both see the same output and the PTY size follows the sender
    oracle: A and B received identical slot 1 output bytes AND PTY size == 40x120 after A's input AND == 30x100 after B's
      input
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs
