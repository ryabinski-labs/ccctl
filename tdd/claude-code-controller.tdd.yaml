    oracle: within 2000 ms slot 2 state == needs-input AND a WebSocket state frame {slot:2,state:'needs-input'} was sent AND
      a log line has event == needs_input, hook == Notification
    doubles: fake claude binary (testdata/fakeclaude) on claude_path; fake Tailscale status and WhoIs; real PTYs; real Unix
